<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111111" />
    <meta name="robots" content="noindex" />
    <title>找不到頁面｜Vivi Chen</title>
    <script>
      const notFoundParts = location.pathname.split('/').filter(Boolean)
      const notFoundProject = location.hostname.endsWith('.github.io') && notFoundParts.length > 0
      window.__VIVI_404_BASE__ = notFoundProject ? `/${notFoundParts[0]}/` : '/'
      const baseElement = document.createElement('base')
      baseElement.href = window.__VIVI_404_BASE__
      document.head.append(baseElement)
    </script>
    <style>
      * { box-sizing: border-box; }

      html,
      body { width: 100%; height: 100%; }

      body {
        margin: 0;
        background: #111111;
        color: #fafafa;
        font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      }

      .not-found {
        position: fixed;
        inset: 0;
        z-index: 2;
        display: grid;
        place-items: center;
        padding: 40px 24px;
        background: #111111;
        text-align: center;
        transition: opacity .8s ease;
      }

      #destination {
        position: fixed;
        inset: 0;
        z-index: 1;
        background: #fafafa;
      }

      .not-found.is-revealing {
        opacity: 0;
        pointer-events: none;
      }

      .not-found__content {
        display: grid;
        justify-items: center;
      }

      .not-found__shape {
        position: relative;
        width: 132px;
        height: 132px;
        opacity: 0;
        transform: scale(.48);
        animation: shape-arrive 1.2s cubic-bezier(.16, 1, .3, 1) .1s forwards;
        will-change: opacity, transform;
      }

      .not-found__square {
        display: grid;
        width: 100%;
        height: 100%;
        place-items: center;
        border-radius: 5px;
        background: #fafafa;
        color: #111111;
        transform: translateZ(0) rotate(45deg);
        transform-origin: 50% 50%;
        backface-visibility: hidden;
        animation: square-turn 1.2s cubic-bezier(.4, 0, .2, 1) .1s forwards;
        will-change: transform;
      }

      .not-found__face {
        position: absolute;
        top: 50%;
        left: 50%;
        display: block;
        width: 76px;
        height: 58px;
        color: #111111;
        opacity: 0;
        transform: translate(-50%, calc(-50% + 8px));
        animation: face-in .4s ease 1.02s forwards;
      }

      .not-found__code {
        margin: 42px 0 8px;
        color: #fafafa;
        font-size: clamp(42px, 7vw, 72px);
        font-weight: 700;
        letter-spacing: .04em;
        line-height: 1;
        transition: opacity .3s ease, transform .3s ease;
      }

      .not-found__message {
        margin: 0;
        color: rgba(250, 250, 250, .68);
        font-size: 16px;
        letter-spacing: .06em;
        line-height: 1.7;
        transition: opacity .3s ease, transform .3s ease;
      }

      .not-found__home {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        margin-top: 30px;
        padding: 0 24px;
        border: 1.5px solid #fafafa;
        border-radius: 999px;
        color: #fafafa;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: .08em;
        text-decoration: none;
        transition: background-color .25s ease, color .25s ease, opacity .3s ease, transform .3s ease;
      }

      .not-found__home:hover,
      .not-found__home:focus-visible {
        background: #fafafa;
        color: #111111;
        outline: none;
      }

      .not-found.is-leaving .not-found__face {
        animation: none;
        opacity: 0;
        transition: opacity .2s ease;
      }

      .not-found.is-leaving .not-found__code,
      .not-found.is-leaving .not-found__message,
      .not-found.is-leaving .not-found__home {
        opacity: 0;
        pointer-events: none;
        transform: translateY(8px);
      }

      @keyframes shape-arrive {
        0% { opacity: 0; transform: scale(.48); }
        18% { opacity: 1; }
        100% { opacity: 1; transform: scale(1); }
      }

      @keyframes square-turn {
        from { transform: translateZ(0) rotate(45deg); }
        to { transform: translateZ(0) rotate(180deg); }
      }

      @keyframes face-in {
        to { opacity: 1; transform: translate(-50%, -50%); }
      }

      @media (max-width: 540px) {
        .not-found__shape { width: 112px; height: 112px; }
        .not-found__face { width: 66px; height: 50px; }
        .not-found__code { margin-top: 36px; }
      }

      @media (prefers-reduced-motion: reduce) {
        .not-found__shape,
        .not-found__square { animation: none; opacity: 1; transform: none; }
        .not-found__face { animation: none; opacity: 1; transform: translate(-50%, -50%); }
      }
    </style>
  </head>
  <body>
    <div id="destination" inert aria-hidden="true"></div>
    <main class="not-found">
      <div class="not-found__content">
        <div class="not-found__shape" aria-hidden="true">
          <div class="not-found__square"></div>
          <svg class="not-found__face" viewBox="0 0 100 76" fill="none">
            <path d="M16 25 Q29 18 42 19" stroke="currentColor" stroke-width="6" stroke-linecap="round" />
            <path d="M58 19 Q71 18 84 25" stroke="currentColor" stroke-width="6" stroke-linecap="round" />
            <ellipse cx="34" cy="38" rx="4" ry="5" fill="currentColor" />
            <ellipse cx="66" cy="38" rx="4" ry="5" fill="currentColor" />
            <path d="M38 59 Q50 49 62 59" stroke="currentColor" stroke-width="6" stroke-linecap="round" />
          </svg>
        </div>
        <h1 class="not-found__code">404</h1>
        <p class="not-found__message">這個頁面好像迷路了</p>
        <a class="not-found__home" href="/">回到首頁</a>
      </div>
    </main>
    <script>
      const home = document.querySelector('.not-found__home')
      const page = document.querySelector('.not-found')
      const shape = document.querySelector('.not-found__shape')
      const square = document.querySelector('.not-found__square')
      const destination = document.querySelector('#destination')
      const siteBase = window.__VIVI_404_BASE__
      home.href = `${siteBase}about/`
      let destinationReady = false
      let revealRequested = false

      const revealDestination = () => {
        if (!destinationReady) {
          revealRequested = true
          return
        }
        history.replaceState(null, '', home.href)
        document.title = 'Vivi Chen'
        destination.inert = false
        destination.removeAttribute('aria-hidden')
        page.classList.add('is-revealing')
        page.addEventListener('transitionend', event => {
          if (event.target === page && event.propertyName === 'opacity') page.remove()
        })
      }

      window.addEventListener('vivi-404-ready', () => {
        destinationReady = true
        if (revealRequested) revealDestination()
      }, {once: true})

      home.addEventListener('click', async event => {
        event.preventDefault()
        if (page.classList.contains('is-leaving')) return

        if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
          revealDestination()
          return
        }

        shape.style.animation = 'none'
        shape.style.opacity = '1'
        shape.style.transform = 'scale(1)'
        square.style.animation = 'none'
        square.style.transform = 'translateZ(0) rotate(180deg)'
        shape.getBoundingClientRect()
        page.classList.add('is-leaving')
        const rect = shape.getBoundingClientRect()
        const centerX = rect.left + rect.width / 2
        const centerY = rect.top + rect.height / 2
        const offsetX = innerWidth / 2 - centerX
        const offsetY = innerHeight / 2 - centerY
        const loaderSize = matchMedia('(max-width: 540px)').matches ? 58 : 68
        const loaderScale = loaderSize / rect.width
        const coverScale = Math.max(innerWidth, innerHeight) * 1.08 / rect.width

        const moveToLoader = shape.animate([
          { opacity: 1, transform: 'translate(0, 0) scale(1)' },
          { opacity: 1, transform: `translate(${offsetX}px, ${offsetY}px) scale(${loaderScale})` }
        ], {
          duration: 560,
          easing: 'cubic-bezier(.4, 0, .2, 1)',
          fill: 'forwards'
        })
        const turnToDiamond = square.animate([
          { transform: 'translateZ(0) rotate(180deg)', borderRadius: '5px' },
          { transform: 'translateZ(0) rotate(225deg)', borderRadius: '3px' }
        ], {
          duration: 560,
          easing: 'cubic-bezier(.4, 0, .2, 1)',
          fill: 'forwards'
        })

        await Promise.all([moveToLoader.finished, turnToDiamond.finished])

        shape.animate([
          { transform: `translate(${offsetX}px, ${offsetY}px) scale(${loaderScale})` },
          { transform: `translate(${offsetX}px, ${offsetY}px) scale(${coverScale})` }
        ], {
          duration: 1250,
          easing: 'cubic-bezier(.65, 0, .2, 1)',
          fill: 'forwards'
        })
        square.animate([
          { transform: 'translateZ(0) rotate(225deg)', borderRadius: '3px' },
          { transform: 'translateZ(0) rotate(360deg)', borderRadius: '0px' }
        ], {
          duration: 1250,
          easing: 'cubic-bezier(.65, 0, .2, 1)',
          fill: 'forwards'
        })

        setTimeout(revealDestination, 450)
      })
    </script>
    <script type="module" src="/src/not-found-entry.jsx"></script>
  </body>
</html>
