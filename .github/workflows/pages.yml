name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            Codex/package-lock.json
            v2/package-lock.json
      - name: Build current site
        working-directory: Codex
        run: |
          npm ci
          npm run build

      - name: Build v2 site
        working-directory: v2
        run: |
          npm ci
          npm run build

      - name: Include v2 alongside the current site
        run: cp -R v2/dist Codex/dist/v2

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Codex/dist
      - id: deployment
        uses: actions/deploy-pages@v4
